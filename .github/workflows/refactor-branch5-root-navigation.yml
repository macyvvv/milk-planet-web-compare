name: Refactor branch5 root navigation CSS

on:
  push:
    branches:
      - refactor/branch5-navigation-css

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/branch5-navigation-css
          fetch-depth: 0
      - run: python3 -m pip install tinycss2
      - run: python3 scripts/refactor_branch5_root_navigation_css.py
      - name: Validate root ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('proposal/branch5')
          files = [root / name for name in ('proposal.css', 'common.css', 'event.css', 'style.css')]
          markers = ('#top-head', '#mobile-head', '#nav-toggle', '#global-nav', '.nav-toggle-', '.nav-submenu')
          bad = []
          for path in files:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if any(marker in line for marker in markers):
                      bad.append(f'{path}:{line_no}: {line.strip()}')
          if bad:
              raise SystemExit('\n'.join(bad))
          PY
      - name: Commit generated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proposal/branch5/proposal.css proposal/branch5/common.css proposal/branch5/event.css proposal/branch5/style.css
          git commit -m "refactor: centralize root navigation CSS"
          git push origin HEAD:refactor/branch5-navigation-css
