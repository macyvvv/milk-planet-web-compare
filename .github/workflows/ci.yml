name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proposal/branch101/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: proposal/branch101/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: E2E Tests
        env:
          DATABASE_URL: "file:/tmp/milk-planet-ci.db"
          DEMO_ADMIN_PIN: "1234"
          E2E_ADMIN_PIN: "1234"
          DEMO_SESSION_SECRET: "00000000000000000000000000000000"
        run: |
          EPHEMERAL_SQLITE_DEMO=0 npm run build
          EPHEMERAL_SQLITE_DEMO=1 npx playwright test
