name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository contract
        run: python3 tools/validate_repo_contract.py

      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
