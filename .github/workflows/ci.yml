name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository contract
        run: python3 tools/validate_repo_contract.py

      - name: Validate Skill packages
        run: python3 tools/validate_skill_packages.py

      - name: Validate all work packets
        run: python3 tools/validate_work_packets.py

      - name: Validate static HTML baseline
        run: python3 tools/validate_static_contract.py proposal/branch5/shop

      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
