  <style>
    :root {
      --melty-pink: #d569a9;
      --melty-deep-pink: #963062;
      --melty-ink: #513743;
      --melty-bg: #fff8fc;
      --melty-pale: #fff0f8;
      --melty-title: #fecff3;
      --melty-line: #e4b1cf;
    }

    body.melty-menu-page {
      margin: 0;
      color: var(--melty-ink);
      background: var(--melty-bg);
    }

    body.melty-menu-page .html-menu {
      color: var(--melty-ink);
      background: var(--melty-bg);
      font-family: Lato, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.7;
      text-shadow: none;
    }

    html body.melty-menu-page h1.menu-page-title:not(.scrolled-title) {
      box-sizing: border-box;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 138px;
      gap: 18px !important;
      padding: 22px 220px 42px !important;
      color: var(--melty-ink) !important;
      background: var(--melty-title) !important;
      font-size: 30px;
      letter-spacing: .1em;
    }

    html body.melty-menu-page h1.menu-page-title > span {
      position: relative;
      z-index: 100;
      color: var(--melty-ink) !important;
      line-height: 1.4 !important;
      white-space: nowrap;
    }

    html body.melty-menu-page h1.menu-page-title .title-shop-logo {
      position: relative;
      z-index: 100;
      display: block;
      flex: 0 0 auto;
      width: 260px !important;
      max-width: 260px !important;
      height: auto !important;
      max-height: 70px !important;
      object-fit: contain;
      margin: 0;
    }

    html body.melty-menu-page h1.menu-page-title:not(.scrolled-title)::after {
      height: 34px !important;
      background: var(--melty-bg) !important;
      -webkit-mask: url("../menu/images/cutline.png") 0 0 / 100% 34px no-repeat;
      mask: url("../menu/images/cutline.png") 0 0 / 100% 34px no-repeat;
    }

    html body.melty-menu-page h1.menu-page-title.scrolled-title {
      color: var(--melty-ink) !important;
      background: rgba(254, 207, 243, .96) !important;
    }

    html body.melty-menu-page h1.menu-page-title.scrolled-title .title-shop-logo {
      width: 180px !important;
      max-width: 180px !important;
      height: auto !important;
      max-height: 48px !important;
    }

    body.melty-menu-page .menu-sheet {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    body.melty-menu-page .menu-sheet img {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
      border-radius: 0;
    }

    body.melty-menu-page .menu-sheet picture {
      display: block;
    }

    body.melty-menu-page .local-nav {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      gap: 4px 18px;
      justify-content: flex-start;
      border-bottom: 1px solid var(--melty-line);
    }

    body.melty-menu-page .local-nav a {
      padding: 8px 2px 6px;
      color: var(--melty-deep-pink);
      border: 0;
      border-bottom: 2px solid var(--melty-line);
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      font-weight: 700;
    }

    body.melty-menu-page .local-nav a:hover,
    body.melty-menu-page .local-nav a:focus-visible {
      color: var(--melty-ink);
      border-bottom-color: var(--melty-deep-pink);
    }

    body.melty-menu-page .menu-section {
      width: min(800px, calc(100% - 40px));
      padding: 48px 0;
    }

    body.melty-menu-page .menu-section + .menu-section {
      border-top: 1px solid var(--melty-line);
    }

    body.melty-menu-page .html-menu .menu-section h2 {
      width: fit-content;
      max-width: 100%;
      margin: 0 0 26px;
      padding: 0 0 9px;
      color: var(--melty-ink);
      background: transparent;
      border: 0;
      border-bottom: 3px solid var(--melty-pink);
      border-radius: 0;
      box-shadow: none;
      text-align: left;
      font-family: Lato, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
      font-size: 28px;
      letter-spacing: .08em;
      line-height: 1.35;
    }

    body.melty-menu-page .promo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }

    body.melty-menu-page .promo-grid .menu-sheet {
      width: 100%;
    }

    body.melty-menu-page .site-footer {
      box-sizing: border-box;
    }

    @media (max-width: 780px) {
      html body.melty-menu-page h1.menu-page-title:not(.scrolled-title) {
        min-height: 90px;
        gap: 8px !important;
        padding: 14px 58px 28px 8px !important;
        font-size: 18px !important;
      }

      html body.melty-menu-page h1.menu-page-title:not(.scrolled-title)::after {
        height: 28px !important;
        -webkit-mask-size: 100% 28px;
        mask-size: 100% 28px;
      }

      html body.melty-menu-page h1.menu-page-title .title-shop-logo {
        width: 128px !important;
        max-width: 128px !important;
        max-height: 36px !important;
      }

      html body.melty-menu-page h1.menu-page-title.scrolled-title .title-shop-logo {
        width: 108px !important;
        max-width: 108px !important;
        max-height: 32px !important;
      }

      body.melty-menu-page .local-nav,
      body.melty-menu-page .menu-section {
        width: calc(100% - 28px);
      }

      body.melty-menu-page .local-nav {
        gap: 2px 14px;
      }

      body.melty-menu-page .menu-section {
        padding: 38px 0;
      }

      body.melty-menu-page .html-menu .menu-section h2 {
        margin-bottom: 20px;
        font-size: clamp(21px, 6vw, 27px);
        letter-spacing: .05em;
      }

      body.melty-menu-page .promo-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>
